[package]
name = "duowave-rights"
description = "DuoWave's floor «Права»: the core of «Связи» (addresses, the ladder, the rule, the trail, a person's «да», the journal, the providers' contract) and people's rights (signing in, roles, API keys)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The gateway's own switches, passed down (gateway/Cargo.toml).
station = ["duowave-base/station"]
# What the tests of the crates above take from this one (the sign-in's test handles).
testing = ["duowave-base/testing"]

[dependencies]
duowave-base = { path = "../duowave-base" }
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
futures.workspace = true
hex.workspace = true
hmac.workspace = true
rand.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
rustls.workspace = true
scrypt.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
duowave-base = { path = "../duowave-base", features = ["testing"] }
http-body-util.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true
