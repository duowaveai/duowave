[package]
name = "duowave-brain"
description = "DuoWave's floor «Мозг»: the conversation and its models (dialog, the router of skills, sign-in at the model providers), the talk layer with its works, memory, the characters, the built-in skills, the tasks and the night's sleep"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The gateway's own switches, passed down (gateway/Cargo.toml). The characters' voices on a computer are the
# computer's floor's (crates/duowave-pc).
station = ["duowave-base/station", "duowave-voice/station"]
# What the tests of the crates above take from this one (the brain's, the dialog's and the sign-in's stand-ins).
testing = ["duowave-base/testing", "duowave-voice/testing"]

[dependencies]
duowave-base = { path = "../duowave-base" }
duowave-voice = { path = "../duowave-voice" }
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
futures.workspace = true
rand.workspace = true
regex.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
duowave-base = { path = "../duowave-base", features = ["testing"] }
duowave-voice = { path = "../duowave-voice", features = ["testing"] }
http-body-util.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true
tracing-subscriber.workspace = true

[target."cfg(unix)".dependencies]
libc.workspace = true
