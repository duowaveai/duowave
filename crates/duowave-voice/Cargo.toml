[package]
name = "duowave-voice"
description = "DuoWave's floor «Голос»: hearing and speaking (recognition, synthesis, the audio and its codecs), the voice lab, the shop of voice and recognition models, and the ear contract — what an ear (a Station, the computer's microphone, a box of our own) can do and say"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The gateway's own switches, passed down (gateway/Cargo.toml). The voice lab, the model shop and recognition on this
# computer are the computer's floor's (crates/duowave-pc).
station = ["duowave-base/station"]
# Silero VAD on ONNX Runtime (a prebuilt library, downloaded at build time): PC builds only. Without it
# VAD_ENGINE=silero falls back to the energy VAD.
silero = ["dep:ort"]
# What the tests of the crates above take from this one (the voice lab's and the recognition's stand-ins).
testing = ["duowave-base/testing"]

[dependencies]
# The door's spec of a hand: an ear declares its hands with it (ear/hands.rs).
duowave-door = { path = "../duowave-door" }
duowave-base = { path = "../duowave-base" }
anyhow.workspace = true
axum.workspace = true
bytes.workspace = true
futures.workspace = true
hex.workspace = true
# Pinned: later release candidates need a newer Rust.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-rustls", "tracing", "api-27"], optional = true }
rand.workspace = true
regex.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
# Opus: libopus 1.3.1 in Rust (c2rust), nothing to compile in C — the station's build needs no cmake, no C toolchain.
unsafe-libopus = "0.2.0"
url.workspace = true

[dev-dependencies]
duowave-base = { path = "../duowave-base", features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
