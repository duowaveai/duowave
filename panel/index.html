<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#FFFFFF">
    <title>DuoWave</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Cpath d='M60 0H196A60 60 0 0 1 256 60V196A60 60 0 0 1 196 256H60A60 60 0 0 1 0 196V60A60 60 0 0 1 60 0Z' fill='%23B6F36A'/%3E%3Cpath d='M81.2 110A16.8 16.8 0 0 1 114.8 110V138A16.8 16.8 0 0 1 81.2 138ZM132.91 123.5A30.32 30.32 0 0 1 183.09 123.5A9.8 9.8 0 0 1 166.87 134.5A10.72 10.72 0 0 0 149.13 134.5A9.8 9.8 0 0 1 132.91 123.5Z' fill='%230B0F0A'/%3E%3C/svg%3E">
    <!-- Плагины пульта (panel.js пакетов) берут Preact и SDK пульта, а не свою копию: import map ведёт их сюда
         (docs/plans/plugins.md, этап 5). Шлюз пускает его по хешу в своей политике содержимого. -->
    <script type="importmap">{"imports":{"preact":"/panel/sdk/preact.js","preact/hooks":"/panel/sdk/preact-hooks.js","preact/jsx-runtime":"/panel/sdk/jsx-runtime.js","@duowave/panel-sdk":"/panel/sdk/panel-sdk.js"}}</script>
    <!-- theme-boot -->
    <script>
        // The theme before the bundle loads, so a dark page never flashes light and a chosen theme never flashes the
        // default one. The choice (panel-theme): { v: 2, id, mode }, null where the person never picked. Older builds
        // stored { id: 'glass', mode } by themselves, without a pick: that is the default theme in its own mode now;
        // any other theme id there was a real pick. The default theme's id and mode are on <style id="theme-boot">,
        // its tokens are built into this page (vite.config.ts); the cached CSS of the very theme and mode follows.
        try {
            const boot = document.getElementById('theme-boot');
            const fallbackId = (boot && boot.dataset.id) || '';
            const fallbackMode = boot && boot.dataset.mode;
            const okMode = (value) => value === 'light' || value === 'dark';
            let raw = null;
            try {
                raw = JSON.parse(localStorage.getItem('panel-theme') || 'null');
            } catch (e) {}
            const fresh = !!raw && raw.v === 2;
            const id = raw && typeof raw.id === 'string' && raw.id && (fresh || raw.id !== 'glass') ? raw.id : null;
            const picked = raw && okMode(raw.mode) && (fresh || id) ? raw.mode : null;
            const mode = picked
                || (!id && okMode(fallbackMode) ? fallbackMode : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
            const root = document.documentElement;
            root.dataset.theme = mode;
            root.dataset.themePick = id || '';
            root.dataset.modePick = picked || '';
            root.dataset.themeId = id || fallbackId;
            if (!id && boot && boot.dataset.look) root.dataset.look = boot.dataset.look;
            const cached = JSON.parse(localStorage.getItem('panel-theme-css') || 'null');
            if (cached && cached.id === (id || fallbackId) && cached.mode === mode && typeof cached.css === 'string') {
                const style = document.createElement('style');
                style.id = 'theme';
                style.textContent = cached.css;
                document.head.appendChild(style);
                if (typeof cached.look === 'string') root.dataset.look = cached.look;
                if (typeof cached.layout === 'string') root.dataset.shell = cached.layout;
            }
        } catch (e) {
            document.documentElement.dataset.theme = 'dark';
        }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
