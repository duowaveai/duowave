# The «VPN» app's program (docs/plans/own-server.md, stage 1): the people's own servers as local entrances for the
# gateway. A project of its own, outside the gateway's workspace (Cargo.toml there excludes it): shoes and its
# dependencies never reach the gateway's builds.
[package]
name = "duowave-own-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false

[[bin]]
name = "duowave-own-server"
path = "src/main.rs"

[workspace]

[dependencies]
# The engine: shoes by its author, pinned (MIT; its WireGuard part MPL-2.0). It runs as this file's second process.
shoes = { git = "https://github.com/cfal/shoes", rev = "d1742b93e0d3541aae75005a610d2c702ead7144" }
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "macros", "signal", "sync", "process", "fs"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
rustls = "=0.23.46"
tokio-rustls = { version = "0.26", default-features = false }
webpki-roots = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
percent-encoding = "2"
url = "2"
serde_yaml = "0.9"
libc = "0.2"

# The same patches as shoes' own Cargo.toml: without them it does not build (its REALITY needs the patched rustls).
[patch.crates-io]
gotatun = { git = "https://github.com/mullvad/gotatun", rev = "c06582e41022bcecbf33751631fd5a63d5794dc5" }
rustls = { git = "https://github.com/cfal/rustls", rev = "f1a23c187330386e9e7f14a21dbae368034dc430" }
blake3 = { git = "https://github.com/cfal/BLAKE3", rev = "5bd8a7ef060bac222502a449bb89b7bdcdb8ec09" }
h3 = { git = "https://github.com/cfal/h3", rev = "90e3013710e35143d1969dc3421f5951fbe49966" }
h3-quinn = { git = "https://github.com/cfal/h3", rev = "90e3013710e35143d1969dc3421f5951fbe49966" }
hickory-net = { git = "https://github.com/cfal/hickory-dns", rev = "93435e55f102ee637eadca89126be85931a804f3" }
hickory-proto = { git = "https://github.com/cfal/hickory-dns", rev = "93435e55f102ee637eadca89126be85931a804f3" }
hickory-resolver = { git = "https://github.com/cfal/hickory-dns", rev = "93435e55f102ee637eadca89126be85931a804f3" }
nix = { git = "https://github.com/nix-rust/nix", rev = "3eae6d68ec6382fef7b38cd58f97458e59a71af9" }
smoltcp = { git = "https://github.com/cfal/smoltcp", rev = "7ef43e497f575cb0340a43e4f414f0f0b8760bf6" }

# For the station: small over fast (13,3 MB against 27,3 MB at opt-level 3 on 15.11, the same eight protocols).
[profile.release]
opt-level = "z"
codegen-units = 1
lto = "fat"
strip = true
# Panics unwind, as in shoes' own build: a panicking connection ends alone, the engine goes on serving the rest.
