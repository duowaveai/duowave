[package]
name = "duowave-desktop"
version = "0.6.0"
description = "The voice gateway in the tray: runs the gateway (the Rust engine, crate duowave, inside the app) and shows its panel"
edition = "2021"
publish = false

# A workspace of its own, apart from the gateway's in the repository root (which excludes this folder): its own
# Cargo.lock and target/, and a checkout nested in another one (a git worktree) does not find the outer workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The gateway itself, in this process (docs/plans/rust-gateway.md, stage 7), with recognition on this computer
# (local-asr: transcribe.cpp in a worker of this app, docs/plans/speech-servers.md; the build needs cmake) and MIDI
# keyboards for apps (midi, docs/plans/midi.md: the app's window has no Web MIDI, the gateway hears the keyboard).
duowave = { path = "../../gateway", features = ["local-asr", "midi"] }
tokio = { version = "1", features = ["sync", "net", "time"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Where the app keeps its data, known before Tauri starts (the same folder as Tauri's app_data_dir).
dirs = "7"
tauri-plugin-notification = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Thin LTO over the default codegen units: the app's dependency tree is large, and fat LTO with one unit, the slowest
# build there is, bought speed the app does not need, on each of five systems.
[profile.release]
lto = "thin"
strip = true

# Debug builds as the gateway's (../../Cargo.toml): line tables for the app and the gateway, no debug info for the
# dependencies: a much smaller cache, quicker to build and link.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.duowave]
debug = "line-tables-only"
