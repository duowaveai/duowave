; Phones call 100 to reach the station through the gateway (its Stasis application "duowave").
[from-phones]
exten => 100,1,NoOp(Call to the station)
 same => n,Stasis(duowave,incoming)
 same => n,Hangup()

; The gateway dials contacts with ARI (POST /channels, app duowave); nothing else is needed here.
