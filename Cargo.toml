# The voice gateway in Rust (gateway/) and, once it runs the Rust engine inside, the desktop app.
[workspace]
resolver = "2"
members = ["gateway"]
# yam: YAM's own repository, checked out there by the release to pack the station's package (release.yml,
# yam-registry.yml) — a package of its own, not a member.
exclude = ["desktop/src-tauri", "yam"]

[workspace.package]
version = "0.5.1"
edition = "2021"
license = "Apache-2.0"
publish = false

# A computer's build: thin LTO over the default codegen units, most of fat LTO's speed for much less build time (the
# release builds it on five platforms). The station's build keeps fat LTO and one unit (below).
# Panics unwind here: a task that panics ends alone (tokio catches it, the voice lab's catch_unwind reports it, a
# plugin's thread dies by itself), and the gateway goes on serving every station and can still update itself. With
# abort one panic anywhere ended the whole process, and a panic at every start kept it from ever reaching the update.
[profile.release]
lto = "thin"
strip = true

# Debug and test builds stay small: line tables for this workspace (a panic or a failed test still names the line),
# no debug info for the dependencies — on a Mac with several worktrees the debug caches had grown past 150 GB
# (11.11.2026). Incremental state stays on, for tests too: after a small edit in the gateway its tests rebuild in ~35 s
# with it and ~60 s without (11.11.2026, M4 Max); scripts/dev/trim-targets.sh clears the state nobody reads.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Tests sign in often: a password hash (scrypt, 16 MB of mixing) takes a second unoptimised, ~50 ms optimised.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# The station: the smallest binary that still runs well (cargo build --profile station).
# Fat LTO and one codegen unit, as before the computer's build went thin: the station's flash and memory are small, and
# its build is one target. Panics abort, without unwinding tables in the flash: the station's own script
# (station-client/gateway.sh) starts the gateway again, and its safety net steps in when that keeps happening.
[profile.station]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
