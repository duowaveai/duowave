# The voice gateway in Rust (gateway/) and, once it runs the Rust engine inside, the desktop app.
[workspace]
resolver = "2"
members = ["gateway", "crates/duowave-base", "crates/duowave-rights", "crates/duowave-voice", "crates/duowave-brain", "crates/duowave-ears", "crates/duowave-apps", "crates/duowave-home", "crates/duowave-pc"]
# yam: YAM's own repository, checked out there by the release to pack the station's package (release.yml,
# yam-registry.yml) — a package of its own, not a member. apps/own-server: the «VPN» app's program with shoes inside,
# a project of its own so that shoes' dependencies never reach the gateway's builds; apps/youtube-lite: «YouTube
# Music» on the station, a small program of its own in the same way.
exclude = ["desktop/src-tauri", "yam", "apps/own-server", "apps/youtube-lite"]

[workspace.package]
version = "0.19.1"
edition = "2021"
license = "Apache-2.0"
publish = false

# The dependencies more than one crate of the workspace takes: their versions and features, once. Each crate names
# the ones it uses (`name.workspace = true`) and says why in its own Cargo.toml.
[workspace.dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
dotenvy = "0.15.7"
flate2 = "1.1.10"
futures = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
http-body-util = "0.1.5"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
libc = "0.2.191"
minisign = "0.9.1"
minisign-verify = "0.3.0"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream", "multipart", "charset", "query", "form"] }
rpassword = "7.5.4"
rusqlite = { version = "0.41.1", features = ["bundled", "serde_json"] }
ring = "0.17.14"
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
scrypt = "0.12.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
sha2 = "0.11.1"
subtle = "2.6.1"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
webpki-roots = "1.0.11"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
strip = true

# Debug and test builds stay small: line tables for this workspace (a panic or a failed test still names the line),
# no debug info for the dependencies — on a Mac with several worktrees the debug caches had grown past 150 GB
# (11.11.2026). Incremental state stays on, for tests too: after a small edit in the gateway its tests rebuild in ~35 s
# with it and ~60 s without (11.11.2026, M4 Max); scripts/dev/trim-targets.sh clears the state nobody reads.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Tests sign in often: a password hash (scrypt, 16 MB of mixing) takes a second unoptimised, ~50 ms optimised.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# The station: the smallest binary that still runs well (cargo build --profile station).
# Fat LTO and one codegen unit, as before the computer's build went thin: the station's flash and memory are small, and
# its build is one target. Panics abort, without unwinding tables in the flash: the station's own script
# (station-client/gateway.sh) starts the gateway again, and its safety net steps in when that keeps happening.
[profile.station]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

# The apps' JavaScript engine (QuickJS, C) optimised in debug and test builds too, as in the program people run: its
# stack limit for scripts (src/plugins/quickjs.rs, 256 KB) is in bytes, and unoptimised a JS call takes ~8 KB of stack
# instead of ~0.35 KB. The built-in «Погода» needed ~165 KB of it on a Mac and ran out on Windows (CI 22.11).
[profile.dev.package.rquickjs-sys]
opt-level = 3
