[package]
name = "duowave"
description = "Voice gateway for Yandex Station: speaks the station's uniproxy protocol and routes speech to our own ASR, LLM and TTS"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "duowave"
path = "src/main.rs"

# The smallest app (stage 9 of docs/plans/plugins.md): the reference for writing one and the program the apps' tests
# run. Only the standard library.
[[bin]]
name = "duowave-echo-app"
path = "src/bin/echo_app.rs"

# The programs the tests stand in for — Claude Code, an ACP agent — in one program that runs on every system, Windows
# too (src/bin/test_stub.rs). Built by `cargo test -p duowave` with the rest; `libc` (pc) for its SIGINT on Unix.
[[bin]]
name = "duowave-test-stub"
path = "src/bin/test_stub.rs"
required-features = ["pc"]

# The end-to-end tests of what only a computer has: its build only (src/computer).
[[test]]
name = "tools"
required-features = ["pc"]

[[test]]
name = "placement"
required-features = ["pc"]

[[test]]
name = "voice_lab"
required-features = ["pc"]

[[test]]
name = "helpers_computer"
required-features = ["pc"]

[[test]]
name = "live_computer"
required-features = ["pc"]

# The end-to-end tests that drive a Station (its protocol, a fake Yandex; tests/fakes): only where the Station's adapter
# is (feature yandex-station).
[[test]]
name = "bus"
required-features = ["yandex-station"]

[[test]]
name = "folder_works"
required-features = ["yandex-station"]

[[test]]
name = "plugins"
required-features = ["yandex-station"]

[[test]]
name = "relay"
required-features = ["yandex-station"]

[[test]]
name = "router"
required-features = ["yandex-station"]

[[test]]
name = "station"
required-features = ["yandex-station"]

[[test]]
name = "talk"
required-features = ["yandex-station"]

[[test]]
name = "works"
required-features = ["yandex-station"]

[features]
default = ["pc", "wasm", "yandex-station"]
# The Station's adapter to the ear contract (src/gateway: Yandex's protocol, the uniproxy server and sessions, the relay
# to Yandex, the Station's commands; docs/plans/modular-gateway.md, «Договор уха»). On in every build that serves a
# Station; a build without it is a home without Yandex's Station — the computer's microphone, the panel, the apps.
yandex-station = ["duowave-ears/yandex-station", "duowave-apps/yandex-station", "duowave-home/yandex-station", "duowave-pc?/yandex-station"]
# Everything that builds from source: the station connect over SSH, local model servers, the voice lab, calls.
# MCP servers as programs on this computer (npx, uvx) too.
pc = ["dep:duowave-pc", "duowave-pc/pc", "dep:libc"]
# The build for the station itself: none of the PC parts; mimalloc in place of musl's allocator (src/main.rs).
station = ["yandex-station", "duowave-base/station", "duowave-rights/station", "duowave-voice/station", "duowave-brain/station", "duowave-ears/station", "duowave-apps/station", "duowave-home/station", "dep:mimalloc", "dep:libmimalloc-sys"]
# Recognition on this computer itself (src/speech/asr/local): GigaAM, Parakeet and Whisper as GGUF through
# transcribe.cpp, in a worker process of this same program. The desktop app's build; transcribe.cpp compiles from C++
# source, so the build needs cmake and a C++ toolchain (docs/plans/speech-servers.md).
local-asr = ["pc", "duowave-pc/local-asr"]
# Plugins in WebAssembly (`"runtime": "wasm"`, src/plugins/wasm.rs): wasmi, an interpreter in pure Rust. In the
# computer's build; the station's adds it with `--features station,wasm` when one is needed there.
wasm = ["duowave-apps/wasm"]
# Silero VAD on ONNX Runtime (a prebuilt library, downloaded at build time): PC builds only. Without it
# VAD_ENGINE=silero falls back to the energy VAD.
silero = ["duowave-voice/silero"]
# A browser on the call page (/calls) over WebRTC: webrtc-rs, pure Rust (src/calls/webrtc_endpoint.rs).
webrtc = ["pc", "duowave-pc/webrtc"]
# Calls through a LiveKit room: LiveKit's Rust SDK, which downloads a prebuilt libwebrtc at build time.
livekit = ["pc", "duowave-pc/livekit"]
# MIDI keyboards for apps (src/midi, docs/plans/midi.md): midir — CoreMIDI on a Mac, WinMM on Windows, ALSA on Linux
# (libasound2-dev to build) — and midly for .mid files. The desktop app and the program for a Mac and Windows; not the
# station's build, nor the Linux program built for musl with zig (ALSA does not build there).
midi = ["duowave-apps/midi"]

[dependencies]
# The floors below, crates of their own (crates/, docs/plans/modular-gateway.md).
duowave-base = { path = "../crates/duowave-base" }
duowave-rights = { path = "../crates/duowave-rights" }
duowave-voice = { path = "../crates/duowave-voice" }
duowave-brain = { path = "../crates/duowave-brain" }
duowave-ears = { path = "../crates/duowave-ears" }
duowave-apps = { path = "../crates/duowave-apps" }
duowave-home = { path = "../crates/duowave-home" }
# The floor «Только компьютер»: only in a computer's build (feature pc).
duowave-pc = { path = "../crates/duowave-pc", optional = true }
# The station's allocator (feature `station`, src/main.rs): musl's mallocng kept the heap broken up by bursts of
# requests and never gave it back (16.11.2026); mimalloc, purging at once, stays flat. `extended`: its options.
mimalloc = { version = "0.1.52", default-features = false, optional = true }
libmimalloc-sys = { version = "0.1.49", features = ["extended"], optional = true }
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
flate2.workspace = true
futures.workspace = true
hex.workspace = true
hmac.workspace = true
# Signals to an MCP program's whole process group (pc).
libc = { workspace = true, optional = true }
rand.workspace = true
regex.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
rust-embed.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tower.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true


[build-dependencies]
# The panel's text gzip-compressed into the program (build.rs): the same flate2 the gateway has already.
flate2.workspace = true

[dev-dependencies]
# The floors' test helpers for the program's tests, which hold every test that needs the whole gateway (feature
# `testing`: the stand-in programs, packages, helpers, stations).
duowave-base = { path = "../crates/duowave-base", features = ["testing"] }
duowave-rights = { path = "../crates/duowave-rights", features = ["testing"] }
duowave-voice = { path = "../crates/duowave-voice", features = ["testing"] }
duowave-brain = { path = "../crates/duowave-brain", features = ["testing"] }
duowave-ears = { path = "../crates/duowave-ears", features = ["testing"] }
duowave-apps = { path = "../crates/duowave-apps", features = ["testing"] }
duowave-home = { path = "../crates/duowave-home", features = ["testing"] }
# Empty without its feature `pc`: a station's test build takes nothing of a computer's from it.
duowave-pc = { path = "../crates/duowave-pc", features = ["testing"] }
http-body-util.workspace = true
# A picture made and read back by the folders' integration test (tests/folders_app.rs).
image.workspace = true
# Signs a test catalog with a throwaway key (src/plugins/catalog.rs): the gateway itself only verifies.
minisign.workspace = true
# The link's tests (whole_tests/helpers_link*.rs, tests/): its TLS on both ends.
tokio-rustls.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[target."cfg(unix)".dependencies]
libc.workspace = true
