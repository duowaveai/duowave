[package]
name = "duowave"
description = "Voice gateway for Yandex Station: speaks the station's uniproxy protocol and routes speech to our own ASR, LLM and TTS"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "duowave"
path = "src/main.rs"

# The smallest app (stage 9 of docs/plans/plugins.md): the reference for writing one and the program the apps' tests
# run. Only the standard library.
[[bin]]
name = "duowave-echo-app"
path = "src/bin/echo_app.rs"

[features]
default = ["pc", "wasm"]
# Everything that builds from source: the station connect over SSH, local model servers, the voice lab, calls.
# MCP servers as programs on this computer (npx, uvx) too.
pc = ["rmcp/transport-async-rw", "dep:libc", "dep:russh", "dep:if-addrs", "dep:socket2"]
# The build for the station itself: none of the PC parts.
station = []
# Plugins in WebAssembly (`"runtime": "wasm"`, src/plugins/wasm.rs): wasmi, an interpreter in pure Rust. In the
# computer's build; the station's adds it with `--features station,wasm` when one is needed there.
wasm = ["dep:wasmi"]
# Silero VAD on ONNX Runtime (a prebuilt library, downloaded at build time): PC builds only. Without it
# VAD_ENGINE=silero falls back to the energy VAD.
silero = ["dep:ort"]
# A browser on the call page (/calls) over WebRTC: webrtc-rs, pure Rust (src/calls/webrtc_endpoint.rs).
webrtc = ["pc", "dep:webrtc", "dep:rtc"]
# Calls through a LiveKit room: LiveKit's Rust SDK, which downloads a prebuilt libwebrtc at build time.
livekit = ["pc", "dep:livekit"]

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
dotenvy = "0.15.7"
flate2 = "1.1.10"
futures = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
livekit = { version = "0.10.1", default-features = false, features = ["native", "rustls-tls-webpki-roots"], optional = true }
minisign-verify = "0.3.0"
# Pinned: later release candidates need a newer Rust.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-rustls", "tracing", "api-27"], optional = true }
# Signals to an MCP program's whole process group (pc).
libc = { version = "0.2.191", optional = true }
if-addrs = { version = "0.15.0", optional = true }
prost = "0.14.4"
prost-reflect = "0.16.5"
prost-types = "0.14.4"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream", "multipart", "charset", "query", "form"] }
# The plugins' engine (src/plugins): QuickJS, built from its C sources with the target's cc (zig for the station).
# Without "parallel": each plugin's runtime lives on its own thread and never crosses threads.
rquickjs = { version = "0.14.0", default-features = false, features = ["std", "futures"] }
rmcp = { version = "3.9.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider", "auth"] }
rtc = { version = "0.21.1", default-features = false, optional = true }
rusqlite = { version = "0.41.1", features = ["bundled", "serde_json"] }
russh = { version = "0.65.1", default-features = false, features = ["ring", "rsa"], optional = true }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
scrypt = "0.12.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
sha2 = "0.11.1"
sse-stream = "0.2.6"
socket2 = { version = "0.6.5", features = ["all"], optional = true }
subtle = "2.6.1"
tar = "0.4.46"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
# Opus: libopus 1.3.1 in Rust (c2rust), nothing to compile in C — the station's build needs no cmake, no C toolchain.
unsafe-libopus = "0.2.0"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
webpki-roots = "1.0.11"
webrtc = { version = "0.21.1", optional = true }
wasmi = { version = "2.0.0", default-features = false, features = ["stable", "std", "validate", "auto-dispatch"], optional = true }

[build-dependencies]
prost-build = "0.14.4"
protox = "0.10.0"

[dev-dependencies]
http-body-util = "0.1.5"
# Signs a test catalog with a throwaway key (src/plugins/catalog.rs): the gateway itself only verifies.
minisign = "0.9.1"
# Test plugins written as WebAssembly text (src/plugins/wasm.rs).
wasmi = { version = "2.0.0", default-features = false, features = ["stable", "std", "validate", "auto-dispatch", "wat"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_SystemInformation", "Win32_Storage_FileSystem"] }
