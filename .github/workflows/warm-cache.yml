# The Rust caches a release starts from. A run on a tag reads only its own Actions cache and main's, so a release
# would compile every dependency from nothing; this builds what release.yml builds — the station's gateway, the gateway
# alone for each platform, the desktop app for each system — on main, under the same shared-key, and saves the target
# folders (dependencies only: swatinem/rust-cache drops our own crates). release.yml reads them and saves nothing.
#
# Daily rather than on every push: the owner pushes main and the tag together, and a dozen more builds then would
# take the runners the release waits for (and macOS ones are few). A day also keeps the caches alive (GitHub drops one
# unread for a week) and picks up a new stable Rust. When a cache is already there for these Cargo.lock files and this
# Rust, the job only reads it (which keeps it alive) and builds nothing. A release after a dependency changed restores
# the newest older cache (the same key without the lock files' hash) and builds only what changed.
name: Warm caches

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  station:
    # As release.yml's station-build.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 10.11.2026
        with:
          targets: aarch64-unknown-linux-musl
      - id: cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: station-aarch64
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-zigbuild
      - if: steps.cache.outputs.cache-hit != 'true'
        run: cargo zigbuild -p duowave --target aarch64-unknown-linux-musl --profile station --no-default-features --features station

  gateway:
    # As release.yml's gateway-binaries: the same matrix and the same build. The panel, the feed and the station's
    # build change only our crate, which is not cached anyway.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, key: duowave-linux-x86_64, target: x86_64-unknown-linux-musl, zig: true }
          - { os: ubuntu-latest, key: duowave-linux-aarch64, target: aarch64-unknown-linux-musl, zig: true }
          - { os: macos-15-intel, key: duowave-darwin-aarch64, target: aarch64-apple-darwin, zig: false }
          - { os: macos-15-intel, key: duowave-darwin-x86_64, target: x86_64-apple-darwin, zig: false }
          - { os: windows-latest, key: duowave-windows-x86_64, target: x86_64-pc-windows-msvc, zig: false }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 10.11.2026
        with:
          targets: ${{ matrix.target }}
      - id: cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ matrix.key }}
      - if: matrix.zig && steps.cache.outputs.cache-hit != 'true'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - if: matrix.zig && steps.cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-zigbuild
      - if: matrix.zig && steps.cache.outputs.cache-hit != 'true'
        run: cargo zigbuild -p duowave --target ${{ matrix.target }} --release
      - if: ${{ !matrix.zig && steps.cache.outputs.cache-hit != 'true' }}
        run: cargo build -p duowave --target ${{ matrix.target }} --release

  desktop:
    # As release.yml's desktop: the same Tauri build (its features and environment), without the bundles.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15-intel, name: macos-aarch64, target: aarch64-apple-darwin }
          - { os: macos-15-intel, name: macos-15-intel }
          - { os: windows-latest, name: windows-latest }
          - { os: ubuntu-22.04, name: ubuntu-22.04 }
          - { os: ubuntu-24.04-arm, name: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 10.11.2026
        with:
          targets: ${{ matrix.target }}
      - id: cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri
          shared-key: release-desktop-${{ matrix.name }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm install -g pnpm@11.22.0 && pnpm install --frozen-lockfile
      # The Tauri CLI release.yml builds with: one version, its files from the lock file, no install scripts.
      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci --prefix scripts/release/tauri-cli --ignore-scripts --no-audit --no-fund
      - name: Tauri's system packages
        if: runner.os == 'Linux' && steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - if: steps.cache.outputs.cache-hit != 'true'
        working-directory: desktop/src-tauri
        shell: bash
        run: node ../../scripts/release/tauri-cli/node_modules/@tauri-apps/cli/tauri.js build --no-bundle ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
