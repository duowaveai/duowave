<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Стекло — колонка</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</head>
<body><div id="root"></div><template id="tpl">

<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; font-family: 'Manrope', system-ui, sans-serif; font-size: 15px; line-height: 22px; font-variant-numeric: tabular-nums; color: {{t.text}}; background-color: {{t.bg}}; background-image: {{t.aurora}};">

<div style="position: absolute; inset: 0; padding: 22px 16px 0; display: flex; flex-direction: column; gap: 16px;">

<header style="display: flex; align-items: center; gap: 12px; min-height: 48px;">
<span aria-hidden="true" style="flex: none; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #B6F36A 0%, #3FE0C5 100%); color: #0B0F0A;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="4"></rect><circle cx="12" cy="14" r="3"></circle></svg></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
<h1 style="margin: 0; font-size: 17px; line-height: 22px; font-weight: 800; letter-spacing: -0.01em;">Колонка «Кухня»</h1>
<span style="display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 18px; color: {{t.sub}};"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: {{t.accent}};"></span>в сети · шлюз на Mac</span>
</div>
<button aria-label="{{themeLabel}}" onClick="{{toggleTheme}}" style="flex: none; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0; padding: 0; cursor: pointer; font: inherit; color: {{t.text}}; {{t.glass}}">
<sc-if value="{{isDark}}" hint-placeholder-val="{{true}}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"></circle><line x1="12" y1="1.5" x2="12" y2="3.5"></line><line x1="12" y1="20.5" x2="12" y2="22.5"></line><line x1="4.6" y1="4.6" x2="6" y2="6"></line><line x1="18" y1="18" x2="19.4" y2="19.4"></line><line x1="1.5" y1="12" x2="3.5" y2="12"></line><line x1="20.5" y1="12" x2="22.5" y2="12"></line><line x1="4.6" y1="19.4" x2="6" y2="18"></line><line x1="18" y1="6" x2="19.4" y2="4.6"></line></svg></sc-if>
<sc-if value="{{isLight}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></sc-if>
</button>
</header>

<section aria-label="Сейчас играет" style="border-radius: 24px; padding: 14px; display: flex; flex-direction: column; gap: 12px; {{t.glass}}">
<div style="display: flex; align-items: center; gap: 12px;">
<span aria-hidden="true" style="flex: none; width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: linear-gradient(140deg, #B6F36A 0%, #3FE0C5 55%, #8B6CFF 100%); color: #0B0F0A;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg></span>
<div style="flex: 1; min-width: 0;">
<div style="font-size: 22px; line-height: 28px; font-weight: 800; letter-spacing: -0.02em;">Любимое</div>
<div style="font-size: 13px; line-height: 18px; color: {{t.sub}};">для Ани · песня 4 из 23</div>
</div>
<button aria-label="{{playLabel}}" onClick="{{togglePlay}}" style="flex: none; width: 48px; height: 48px; border-radius: 50%; border: 0; margin: 0; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; background: {{t.accent}}; color: {{t.onAccent}};">
<sc-if value="{{playing}}" hint-placeholder-val="{{true}}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1.5"></rect><rect x="14" y="4" width="4" height="16" rx="1.5"></rect></svg></sc-if>
<sc-if value="{{paused}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 8 4.5z"></path></svg></sc-if>
</button>
</div>
<div role="progressbar" aria-label="Сколько песни прошло" aria-valuemin="0" aria-valuemax="220" aria-valuenow="134" style="height: 4px; border-radius: 2px; background: {{t.track}};"><div style="width: 61%; height: 4px; border-radius: 2px; background: {{t.accent}};"></div></div>
</section>

<div>
<div role="radiogroup" aria-label="Режим колонки" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; {{t.glass}}">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
<button role="radio" aria-checked="{{m.on}}" onClick="{{m.pick}}" style="min-height: 40px; border-radius: 999px; border: 0; margin: 0; padding: 0 8px; cursor: pointer; font: inherit; font-size: 14px; {{m.style}}">{{m.label}}</button>
</sc-for>
</div>
<p style="margin: 8px 6px 0; font-size: 13px; line-height: 18px; color: {{t.sub}};">{{modeNote}}</p>
</div>

<section aria-labelledby="alloc-h" style="border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px; {{t.glass}}">
<div style="display: flex; align-items: baseline; justify-content: space-between;">
<h2 id="alloc-h" style="margin: 0; font-size: 15px; line-height: 20px; font-weight: 800;">Кто отвечает</h2>
<span style="font-size: 13px; line-height: 18px; color: {{t.sub}};">17 возможностей</span>
</div>
<div aria-hidden="true" style="display: flex; gap: 3px; height: 10px;">
<sc-for list="{{alloc}}" as="a" hint-placeholder-count="4">
<span style="height: 10px; border-radius: 5px; {{a.barStyle}}"></span>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px 16px;">
<sc-for list="{{alloc}}" as="a" hint-placeholder-count="4">
<span style="display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 18px;"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: {{a.color}};"></span><span style="color: {{a.sub}};">{{a.label}}</span><span style="font-weight: 800;">{{a.n}}</span></span>
</sc-for>
</div>
</section>

<section aria-labelledby="routes-h" style="border-radius: 24px; padding: 4px 16px 8px; {{t.glass}}">
<div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px;">
<h2 id="routes-h" style="margin: 0; font-size: 15px; line-height: 20px; font-weight: 800;">Маршруты</h2>
<button style="min-height: 44px; border: 0; margin: 0; padding: 0; background: transparent; cursor: pointer; font: inherit; font-size: 14px; font-weight: 700; color: {{t.accentText}};">Все 17</button>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 12px; min-height: 58px; border-top: 1px solid {{r.divider}};">
<span aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{r.iconBg}}; color: {{r.iconColor}};">
<sc-if value="{{r.isMusic}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg></sc-if>
<sc-if value="{{r.isChat}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"></path></svg></sc-if>
<sc-if value="{{r.isPlayer}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"></rect><rect x="14" y="5" width="4" height="14" rx="1.5"></rect></svg></sc-if>
<sc-if value="{{r.isTimer}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2 2"></path><path d="M10 2h4"></path></svg></sc-if>
<sc-if value="{{r.isHome}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H4.5A1.5 1.5 0 0 1 3 20z"></path></svg></sc-if>
</span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
<span style="font-weight: 700;">{{r.name}}</span>
<span style="font-size: 12px; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: {{r.sub}};">{{r.last}}</span>
</div>
<div style="flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 2px;">
<span style="padding: 2px 10px; border-radius: 999px; font-size: 12px; line-height: 18px; font-weight: 800; background: {{r.pillBg}}; color: {{r.pillFg}};">{{r.exec}}</span>
<span style="font-size: 12px; line-height: 16px; color: {{r.sub}};">{{r.n}} за сутки</span>
</div>
</div>
</sc-for>
</section>

</div>

<nav aria-label="Разделы" style="position: absolute; left: 16px; right: 16px; bottom: 18px; height: 68px; box-sizing: border-box; border-radius: 34px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 0 6px; {{t.glassStrong}}">
<button aria-current="page" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 0; margin: 0; padding: 0; background: transparent; cursor: pointer; font: inherit; font-size: 11px; line-height: 14px; font-weight: 800; color: {{t.accentText}};"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H4.5A1.5 1.5 0 0 1 3 20z"></path></svg>Колонка</button>
<button style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 0; margin: 0; padding: 0; background: transparent; cursor: pointer; font: inherit; font-size: 11px; line-height: 14px; font-weight: 600; color: {{t.sub}};"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>Маршруты</button>
<button aria-label="Сказать через колонку" style="justify-self: center; width: 56px; height: 56px; border-radius: 50%; border: 0; margin: 0; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; background: {{t.accent}}; color: {{t.onAccent}}; box-shadow: {{t.talkShadow}};"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg></button>
<a href="GlassLinks.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; font-size: 11px; line-height: 14px; font-weight: 600; color: {{t.sub}};"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-5"></path><path d="M9 8V2"></path><path d="M15 8V2"></path><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8z"></path></svg>Связи</a>
<button style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 0; margin: 0; padding: 0; background: transparent; cursor: pointer; font: inherit; font-size: 11px; line-height: 14px; font-weight: 600; color: {{t.sub}};"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>Я</button>
</nav>

</div>
</template>
<script>
class DCLogic { constructor(p) { this.props = p || {}; this.state = {}; } setState(p) { Object.assign(this.state, p); render(); } forceUpdate() { render(); } }
function lookup(ctx, p) { p = p.trim(); if (p === 'true') return true; if (p === 'false') return false;
  if (/^-?\d+(\.\d+)?$/.test(p)) return Number(p); return p.split('.').reduce((o, k) => (o == null ? undefined : o[k]), ctx); }
function interp(s, ctx) { const m = s.match(/^\s*\{\{([^}]+)\}\}\s*$/); if (m) return lookup(ctx, m[1]);
  return s.replace(/\{\{([^}]+)\}\}/g, (_, p) => { const v = lookup(ctx, p); return v == null ? '' : String(v); }); }
function build(n, ctx, out) {
  if (n.nodeType === 3) { const v = interp(n.nodeValue, ctx); out.appendChild(document.createTextNode(v == null ? '' : String(v))); return; }
  if (n.nodeType !== 1) return;
  const tag = n.localName;
  if (tag === 'sc-for') { const list = interp(n.getAttribute('list'), ctx) || []; const as = n.getAttribute('as');
    list.forEach((item, i) => { const c = Object.assign(Object.create(ctx), { [as]: item, $index: i }); n.childNodes.forEach((ch) => build(ch, c, out)); }); return; }
  if (tag === 'sc-if') { if (interp(n.getAttribute('value'), ctx)) n.childNodes.forEach((ch) => build(ch, ctx, out)); return; }
  const el = n.namespaceURI && n.namespaceURI !== 'http://www.w3.org/1999/xhtml' ? document.createElementNS(n.namespaceURI, tag) : document.createElement(tag);
  for (const a of n.attributes) { if (a.name.startsWith('hint-')) continue; const v = interp(a.value, ctx);
    if (a.name.startsWith('on') && typeof v === 'function') el.addEventListener(a.name.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(a.name, v === true ? 'true' : String(v)); }
  n.childNodes.forEach((ch) => build(ch, ctx, el)); out.appendChild(el);
}
let comp;
function render() { const root = document.getElementById('root'); const vals = comp.renderVals(); root.textContent = '';
  document.getElementById('tpl').content.childNodes.forEach((ch) => build(ch, vals, root)); }

class Component extends DCLogic {
  themes() {
    const glass = (bg, border, highlight, shadow, blur) => 'background: ' + bg + '; border: 1px solid ' + border + '; box-shadow: inset 0 1px 0 ' + highlight + ', ' + shadow + '; backdrop-filter: blur(' + blur + 'px) saturate(160%); -webkit-backdrop-filter: blur(' + blur + 'px) saturate(160%);';
    return {
      dark: {
        bg: '#090C10',
        aurora: 'radial-gradient(120% 70% at 0% 0%, rgba(182, 243, 106, 0.30) 0%, rgba(182, 243, 106, 0) 55%), radial-gradient(90% 60% at 100% 38%, rgba(63, 224, 197, 0.24) 0%, rgba(63, 224, 197, 0) 60%), radial-gradient(110% 60% at 20% 100%, rgba(139, 108, 255, 0.26) 0%, rgba(139, 108, 255, 0) 62%)',
        text: '#F3F6F8', sub: 'rgba(243, 246, 248, 0.68)',
        glass: glass('rgba(255, 255, 255, 0.07)', 'rgba(255, 255, 255, 0.13)', 'rgba(255, 255, 255, 0.10)', '0 12px 32px rgba(0, 0, 0, 0.35)', 24),
        glassStrong: glass('rgba(16, 20, 27, 0.62)', 'rgba(255, 255, 255, 0.14)', 'rgba(255, 255, 255, 0.10)', '0 16px 40px rgba(0, 0, 0, 0.45)', 28),
        divider: 'rgba(255, 255, 255, 0.08)', track: 'rgba(255, 255, 255, 0.14)', iconBg: 'rgba(255, 255, 255, 0.09)',
        accent: '#B6F36A', onAccent: '#0B0F0A', accentText: '#B6F36A', talkShadow: '0 8px 24px rgba(182, 243, 106, 0.35)',
        segOn: 'background: #B6F36A; color: #0B0F0A; font-weight: 800;', segOff: 'background: transparent; color: rgba(243, 246, 248, 0.72); font-weight: 600;',
        own: ['#B6F36A', 'rgba(182, 243, 106, 0.16)'], yandex: ['#FFB547', 'rgba(255, 181, 71, 0.16)'],
        agent: ['#C2A8FF', 'rgba(183, 155, 255, 0.18)'], off: ['#AEB6C1', 'rgba(174, 182, 193, 0.14)'],
        bar: { own: '#B6F36A', yandex: '#FFB547', agent: '#C2A8FF', off: '#AEB6C1' }
      },
      light: {
        bg: '#EDF1EF',
        aurora: 'radial-gradient(120% 70% at 0% 0%, rgba(163, 230, 53, 0.45) 0%, rgba(163, 230, 53, 0) 55%), radial-gradient(90% 60% at 100% 38%, rgba(45, 212, 191, 0.34) 0%, rgba(45, 212, 191, 0) 60%), radial-gradient(110% 60% at 20% 100%, rgba(167, 139, 250, 0.34) 0%, rgba(167, 139, 250, 0) 62%)',
        text: '#0D1117', sub: 'rgba(13, 17, 23, 0.66)',
        glass: glass('rgba(255, 255, 255, 0.58)', 'rgba(255, 255, 255, 0.85)', 'rgba(255, 255, 255, 0.9)', '0 10px 30px rgba(30, 41, 59, 0.10)', 24),
        glassStrong: glass('rgba(255, 255, 255, 0.74)', 'rgba(255, 255, 255, 0.9)', 'rgba(255, 255, 255, 0.95)', '0 14px 36px rgba(30, 41, 59, 0.16)', 28),
        divider: 'rgba(13, 17, 23, 0.07)', track: 'rgba(13, 17, 23, 0.10)', iconBg: 'rgba(255, 255, 255, 0.75)',
        accent: '#A3E635', onAccent: '#0D1117', accentText: '#3F6212', talkShadow: '0 8px 22px rgba(101, 163, 13, 0.30)',
        segOn: 'background: #0D1117; color: #F3F6F8; font-weight: 800;', segOff: 'background: transparent; color: rgba(13, 17, 23, 0.7); font-weight: 600;',
        own: ['#3F6212', '#E2F7C2'], yandex: ['#9A4A05', '#FDE8C8'],
        agent: ['#5B21B6', '#ECE5FF'], off: ['#4B5563', '#E6E8EC'],
        bar: { own: '#84CC16', yandex: '#F59E0B', agent: '#8B5CF6', off: '#9CA3AF' }
      }
    };
  }

  renderVals() {
    const st = this.state || {};
    const name = st.theme || this.props.theme || 'dark';
    const t = this.themes()[name] || this.themes().dark;
    const mode = st.mode || 'gateway';
    const playing = st.playing !== false;

    const MODES = [['relay', 'Яндекс'], ['gateway', 'Шлюз'], ['own', 'Свой']];
    const modes = MODES.map((m) => ({
      label: m[1], on: m[0] === mode,
      style: m[0] === mode ? t.segOn : t.segOff,
      pick: () => this.setState({ mode: m[0] })
    }));
    const modeNote = mode === 'relay'
      ? 'Всё отвечает Яндекс, как до шлюза. Звонки по ссылке и помощник не работают.'
      : mode === 'own'
        ? 'Без Яндекса. Радио, сказки, напоминания и навыки пока не умеем.'
        : 'Сначала свой, Яндекс подхватывает то, чего мы не умеем.';

    const COUNTS = { relay: [0, 17, 0, 0], gateway: [7, 8, 1, 1], own: [11, 0, 1, 5] }[mode];
    const LABELS = [['own', 'свой'], ['yandex', 'Яндекс'], ['agent', 'агент'], ['off', 'нет']];
    const alloc = LABELS.map((l, i) => ({
      label: l[1], n: COUNTS[i], color: t.bar[l[0]], sub: t.sub,
      barStyle: COUNTS[i] ? 'flex: ' + COUNTS[i] + ' 1 0; background: ' + t.bar[l[0]] + ';' : 'display: none;'
    })).filter((a) => a.n > 0);

    const execOf = (route, hasOwn) => {
      if (mode === 'relay') return 'yandex';
      if (mode === 'own' && route === 'yandex') return hasOwn ? 'own' : 'off';
      if (mode === 'own' && route === 'both') return 'own';
      return route;
    };
    const EXEC = { own: 'свой', both: 'сначала свой', yandex: 'Яндекс', agent: 'агент', off: 'не умеем' };
    const TONE = { own: 'own', both: 'own', yandex: 'yandex', agent: 'agent', off: 'off' };
    const rows = [
      { name: 'Музыка', last: '«Включи любимое»', route: 'own', own: true, n: 41, icon: 'music' },
      { name: 'Разговор', last: '«Который час?»', route: 'both', own: true, n: 38, icon: 'chat' },
      { name: 'Стоп, пауза, дальше', last: '«Что сейчас играет?»', route: 'yandex', own: true, n: 31, icon: 'player' },
      { name: 'Таймеры', last: '«Таймер на 10 минут»', route: 'both', own: true, n: 9, icon: 'timer' },
      { name: 'Умный дом', last: '«Погаси свет на кухне»', route: 'agent', own: false, n: 4, icon: 'home' }
    ].map((r, i) => {
      const e = execOf(r.route, r.own);
      const tone = t[TONE[e]];
      return {
        name: r.name, last: r.last, n: r.n, exec: EXEC[e],
        pillFg: tone[0], pillBg: tone[1], sub: t.sub,
        divider: i === 0 ? 'transparent' : t.divider,
        iconBg: t.iconBg, iconColor: t.text,
        isMusic: r.icon === 'music', isChat: r.icon === 'chat', isPlayer: r.icon === 'player', isTimer: r.icon === 'timer', isHome: r.icon === 'home'
      };
    });

    return {
      t, isDark: name === 'dark', isLight: name === 'light',
      themeLabel: name === 'dark' ? 'Светлая тема' : 'Тёмная тема',
      toggleTheme: () => this.setState({ theme: name === 'dark' ? 'light' : 'dark' }),
      playing, paused: !playing, playLabel: playing ? 'Пауза' : 'Играть',
      togglePlay: () => this.setState({ playing: !playing }),
      modes, modeNote, alloc, rows
    };
  }
}
