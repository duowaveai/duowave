<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Стекло — дашборд колонки, светлая тема</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
@keyframes gd-orbit{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}
@keyframes gd-comet{from{stroke-dashoffset:14}to{stroke-dashoffset:-100}}
@keyframes gd-ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.55);opacity:0}}
@keyframes gd-sheet{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes gd-drop{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.gd-anim{animation:none!important}}
</style>


<style>
body{margin:0}
@keyframes st2-breathe{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes st2-pulse{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes st2-blink{0%,49%{opacity:1}50%,100%{opacity:.18}}
@keyframes st2-spin{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}
@keyframes st2-listen{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.3);opacity:0}}
@keyframes st2-ripple{0%{transform:scale(.94);opacity:.75}100%{transform:scale(1.42);opacity:0}}
@media (prefers-reduced-motion:reduce){.st2-anim{animation:none!important}}
</style>
</head>
<body><div id="root"></div>
<template id="tpl-GlassDashLight">

<div style="width: 390px; height: 844px;">
<dc-import name="GlassDash" theme="light" hint-size="390px,844px"></dc-import>
</div>
</template>
<template id="tpl-GlassDash">

<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; font-family: 'Manrope', system-ui, sans-serif; font-size: 15px; line-height: 22px; font-variant-numeric: tabular-nums; color: {{t.text}}; background-color: {{t.bg}}; background-image: {{t.aurora}};">

<svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0; pointer-events: none;">
<defs><filter id="gd-blur-{{uid}}" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"></feGaussianBlur></filter></defs>
<path d="M195 234A150 230 0 1 1 195 694A150 230 0 1 1 195 234Z" fill="none" stroke="{{t.orbit}}" stroke-width="1"></path>
<path class="gd-anim" d="M195 234A150 230 0 1 1 195 694A150 230 0 1 1 195 234Z" fill="none" stroke="{{t.orbitHi}}" stroke-width="2" stroke-linecap="round" pathLength="100" stroke-dasharray="8 92" opacity="0.7" style="animation: gd-orbit 20s linear infinite;"></path>
<sc-if value="{{isThink}}" hint-placeholder-val="{{false}}">
<path class="gd-anim" d="M59.1 561.2A150 230 0 0 1 195 234" fill="none" stroke="{{cometThink}}" stroke-width="9" stroke-linecap="round" pathLength="100" stroke-dasharray="14 100" stroke-dashoffset="14" opacity="0.5" filter="url(#gd-blur-{{uid}})" style="animation: gd-comet 1.1s cubic-bezier(0.4, 0, 0.2, 1) forwards;"></path>
<path class="gd-anim" d="M59.1 561.2A150 230 0 0 1 195 234" fill="none" stroke="{{cometThink}}" stroke-width="3" stroke-linecap="round" pathLength="100" stroke-dasharray="14 100" stroke-dashoffset="14" style="animation: gd-comet 1.1s cubic-bezier(0.4, 0, 0.2, 1) forwards;"></path>
</sc-if>
<sc-if value="{{isSpeak}}" hint-placeholder-val="{{false}}">
<path class="gd-anim" d="M195 234A150 230 0 0 1 330.9 561.2" fill="none" stroke="{{cometSpeak}}" stroke-width="9" stroke-linecap="round" pathLength="100" stroke-dasharray="14 100" stroke-dashoffset="14" opacity="0.5" filter="url(#gd-blur-{{uid}})" style="animation: gd-comet 1.1s cubic-bezier(0.4, 0, 0.2, 1) forwards;"></path>
<path class="gd-anim" d="M195 234A150 230 0 0 1 330.9 561.2" fill="none" stroke="{{cometSpeak}}" stroke-width="3" stroke-linecap="round" pathLength="100" stroke-dasharray="14 100" stroke-dashoffset="14" style="animation: gd-comet 1.1s cubic-bezier(0.4, 0, 0.2, 1) forwards;"></path>
</sc-if>
</svg>

<div style="position: absolute; left: 75px; top: 357px; width: 240px; height: 200px;">
<dc-import name="StationLite2" skin="{{cur.skin}}" clock="{{cur.clock}}" ring="{{ringColor}}" stage="{{speakerStage}}" theme="{{themeName}}" hint-size="240px,200px"></dc-import>
</div>
<button aria-label="Показать путь вопроса" onClick="{{play}}" style="position: absolute; left: 92px; top: 374px; width: 206px; height: 176px; border: 0; margin: 0; padding: 0; border-radius: 48px; background: transparent; cursor: pointer;"></button>
<div aria-live="polite" style="position: absolute; left: 97px; top: 562px; width: 196px; display: flex; flex-direction: column; align-items: center; text-align: center; pointer-events: none;">
<span style="font-size: 13px; line-height: 16px; font-weight: 800; white-space: nowrap;">{{cap1}}</span>
<span style="font-size: 12px; line-height: 16px; white-space: nowrap; color: {{t.sub}};">{{cap2}}</span>
</div>

<span aria-hidden="true" style="position: absolute; left: 104px; top: 647px; width: 32px; height: 32px; box-sizing: border-box; border-radius: 50%; display: flex; align-items: center; justify-content: center; {{sat.home.circle}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H4.5A1.5 1.5 0 0 1 3 20z"></path></svg></span>
<span aria-hidden="true" style="position: absolute; left: 140px; top: 670px; width: 32px; height: 32px; box-sizing: border-box; border-radius: 50%; display: flex; align-items: center; justify-content: center; {{sat.mcp.circle}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"></circle><circle cx="18" cy="6" r="2.5"></circle><circle cx="12" cy="18" r="2.5"></circle><path d="M8.5 6h7M7.3 8.2l3.5 7.6M16.7 8.2l-3.5 7.6"></path></svg><sc-if value="{{sat.mcp.badge}}" hint-placeholder-val="{{true}}"><span style="position: absolute; right: -6px; top: -6px; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 999px; font-size: 10px; line-height: 16px; font-weight: 800; text-align: center; background: {{sat.mcp.line}}; color: {{t.onBadge}};">{{sat.mcp.count}}</span></sc-if><sc-if value="{{sat.mcp.active}}" hint-placeholder-val="{{false}}"><span class="gd-anim" style="position: absolute; inset: -4px; border-radius: 50%; border: 2px solid {{sat.mcp.line}}; animation: gd-ring 1.1s ease-out infinite;"></span></sc-if></span>
<span aria-hidden="true" style="position: absolute; left: 179px; top: 678px; width: 32px; height: 32px; box-sizing: border-box; border-radius: 50%; display: flex; align-items: center; justify-content: center; {{sat.agent.circle}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="8" width="14" height="11" rx="3"></rect><path d="M12 8V5"></path><circle cx="12" cy="4" r="1"></circle><line x1="9.5" y1="13" x2="9.51" y2="13"></line><line x1="14.5" y1="13" x2="14.51" y2="13"></line></svg></span>
<span aria-hidden="true" style="position: absolute; left: 218px; top: 670px; width: 32px; height: 32px; box-sizing: border-box; border-radius: 50%; display: flex; align-items: center; justify-content: center; {{sat.calls.circle}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></span>
<span aria-hidden="true" style="position: absolute; left: 254px; top: 647px; width: 32px; height: 32px; box-sizing: border-box; border-radius: 50%; display: flex; align-items: center; justify-content: center; {{sat.chats.circle}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"></path><path d="M22 2 15 22l-4-9-9-4z"></path></svg></span>
<button aria-label="{{linksAria}}" onClick="{{openLinks}}" style="position: absolute; left: 96px; top: 638px; width: 198px; height: 108px; box-sizing: border-box; border: 0; margin: 0; padding: 0 0 4px; border-radius: 24px; background: transparent; cursor: pointer; font: inherit; display: flex; align-items: flex-end; justify-content: center;">
<span style="font-size: 13px; line-height: 18px; font-weight: 800; color: {{linksCapColor}};">{{linksCap}}</span>
</button>

<button aria-label="{{brain.aria}}" onClick="{{brain.open}}" style="position: absolute; left: 135px; top: 162px; width: 120px; display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; margin: 0; padding: 0; background: transparent; cursor: pointer; font: inherit; color: {{t.text}};">
<span style="display: flex; flex-direction: column; align-items: center; padding: 3px 10px; border-radius: 14px; {{t.labelGlass}}"><span style="font-size: 12px; line-height: 16px; color: {{t.sub}};">Мозг</span><span style="font-size: 13px; line-height: 18px; font-weight: 800; white-space: nowrap;">{{brain.value}}</span></span>
<span style="position: relative; width: 52px; height: 52px; box-sizing: border-box; border-radius: 50%; display: flex; align-items: center; justify-content: center; {{brain.circle}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path><path d="M19 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"></path></svg><sc-if value="{{brain.active}}" hint-placeholder-val="{{false}}"><span class="gd-anim" style="position: absolute; inset: -4px; border-radius: 50%; border: 2px solid {{brain.line}}; animation: gd-ring 1.1s ease-out infinite;"></span></sc-if></span>
</button>

<button aria-label="{{persona.aria}}" onClick="{{persona.open}}" style="position: absolute; left: 16px; top: 295px; width: 98px; display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; margin: 0; padding: 0; background: transparent; cursor: pointer; font: inherit; color: {{t.text}};">
<span style="display: flex; flex-direction: column; align-items: center; padding: 3px 10px; border-radius: 14px; {{t.labelGlass}}"><span style="font-size: 12px; line-height: 16px; color: {{t.sub}};">Характер</span><span style="font-size: 13px; line-height: 18px; font-weight: 800; white-space: nowrap;">{{persona.value}}</span></span>
<span style="position: relative; width: 52px; height: 52px; box-sizing: border-box; border-radius: 50%; display: flex; align-items: center; justify-content: center; {{persona.circle}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0"></path><line x1="9" y1="9.5" x2="9.01" y2="9.5"></line><line x1="15" y1="9.5" x2="15.01" y2="9.5"></line></svg><sc-if value="{{persona.active}}" hint-placeholder-val="{{false}}"><span class="gd-anim" style="position: absolute; inset: -4px; border-radius: 50%; border: 2px solid {{persona.line}}; animation: gd-ring 1.1s ease-out infinite;"></span></sc-if></span>
</button>

<button aria-label="{{think.aria}}" onClick="{{think.open}}" style="position: absolute; left: 276px; top: 295px; width: 98px; display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; margin: 0; padding: 0; background: transparent; cursor: pointer; font: inherit; color: {{t.text}};">
<span style="display: flex; flex-direction: column; align-items: center; padding: 3px 10px; border-radius: 14px; {{t.labelGlass}}"><span style="font-size: 12px; line-height: 16px; color: {{t.sub}};">Мышление</span><span style="font-size: 13px; line-height: 18px; font-weight: 800; white-space: nowrap;">{{think.value}}</span></span>
<span style="position: relative; width: 52px; height: 52px; box-sizing: border-box; border-radius: 50%; display: flex; align-items: center; justify-content: center; {{think.circle}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17a8 8 0 1 1 16 0"></path><path d="M12 17l4.5-5"></path><circle cx="12" cy="17" r="1.2"></circle></svg><sc-if value="{{think.active}}" hint-placeholder-val="{{false}}"><span class="gd-anim" style="position: absolute; inset: -4px; border-radius: 50%; border: 2px solid {{think.line}}; animation: gd-ring 1.1s ease-out infinite;"></span></sc-if></span>
</button>

<button aria-label="{{ear.aria}}" onClick="{{ear.open}}" style="position: absolute; left: 16px; top: 535px; width: 98px; display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; margin: 0; padding: 0; background: transparent; cursor: pointer; font: inherit; color: {{t.text}};">
<span style="position: relative; width: 52px; height: 52px; box-sizing: border-box; border-radius: 50%; display: flex; align-items: center; justify-content: center; {{ear.circle}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8.5a6 6 0 0 1 12 0c0 3.2-2.2 4.2-3.2 5.6-.8 1.1-.9 2.6-1.9 3.7a3 3 0 0 1-4.9-1.3"></path><path d="M9.2 9a2.8 2.8 0 0 1 5.6 0c0 1.4-1 2-1.8 2.6"></path></svg><sc-if value="{{ear.active}}" hint-placeholder-val="{{false}}"><span class="gd-anim" style="position: absolute; inset: -4px; border-radius: 50%; border: 2px solid {{ear.line}}; animation: gd-ring 1.1s ease-out infinite;"></span></sc-if></span>
<span style="display: flex; flex-direction: column; align-items: center; padding: 3px 10px; border-radius: 14px; {{t.labelGlass}}"><span style="font-size: 12px; line-height: 16px; color: {{t.sub}};">Слух</span><span style="font-size: 13px; line-height: 18px; font-weight: 800; white-space: nowrap;">{{ear.value}}</span></span>
</button>

<button aria-label="{{voice.aria}}" onClick="{{voice.open}}" style="position: absolute; left: 276px; top: 535px; width: 98px; display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; margin: 0; padding: 0; background: transparent; cursor: pointer; font: inherit; color: {{t.text}};">
<span style="position: relative; width: 52px; height: 52px; box-sizing: border-box; border-radius: 50%; display: flex; align-items: center; justify-content: center; {{voice.circle}}"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="10" x2="4" y2="14"></line><line x1="8" y1="6" x2="8" y2="18"></line><line x1="12" y1="3" x2="12" y2="21"></line><line x1="16" y1="6" x2="16" y2="18"></line><line x1="20" y1="10" x2="20" y2="14"></line></svg><sc-if value="{{voice.active}}" hint-placeholder-val="{{false}}"><span class="gd-anim" style="position: absolute; inset: -4px; border-radius: 50%; border: 2px solid {{voice.line}}; animation: gd-ring 1.1s ease-out infinite;"></span></sc-if></span>
<span style="display: flex; flex-direction: column; align-items: center; padding: 3px 10px; border-radius: 14px; {{t.labelGlass}}"><span style="font-size: 12px; line-height: 16px; color: {{t.sub}};">Голос</span><span style="font-size: 13px; line-height: 18px; font-weight: 800; white-space: nowrap;">{{voice.value}}</span></span>
</button>

<header style="position: absolute; left: 16px; right: 16px; top: 22px; display: flex; align-items: center; gap: 12px; min-height: 48px;">
<button aria-label="{{speakerAria}}" aria-haspopup="dialog" aria-expanded="{{pickerOpen}}" onClick="{{openPicker}}" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; border: 0; margin: 0; padding: 0; background: transparent; cursor: pointer; font: inherit; color: {{t.text}}; text-align: left;">
<span aria-hidden="true" style="flex: none; width: 44px; height: 44px; box-sizing: border-box; border-radius: 50%; display: flex; align-items: center; justify-content: center; {{t.glass}}"><svg width="28" height="24" viewBox="0 0 28 24"><path d="M3 8V16.5A11 4.5 0 0 0 25 16.5V8Z" fill="{{cur.body}}"></path><ellipse cx="14" cy="8" rx="11" ry="4.5" fill="{{cur.top}}"></ellipse></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
<span style="display: flex; align-items: center; gap: 4px; min-width: 0;"><span style="font-size: 17px; line-height: 22px; font-weight: 800; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{cur.name}}</span><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none; color: {{t.sub}};"><path d="M6 9l6 6 6-6"></path></svg></span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 18px; color: {{t.sub}};"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: {{statusDot}};"></span>{{status}}</span>
</span>
</button>
<button aria-label="{{themeLabel}}" onClick="{{toggleTheme}}" style="flex: none; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0; padding: 0; cursor: pointer; font: inherit; color: {{t.text}}; {{t.glass}}">
<sc-if value="{{isDark}}" hint-placeholder-val="{{true}}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"></circle><line x1="12" y1="1.5" x2="12" y2="3.5"></line><line x1="12" y1="20.5" x2="12" y2="22.5"></line><line x1="4.6" y1="4.6" x2="6" y2="6"></line><line x1="18" y1="18" x2="19.4" y2="19.4"></line><line x1="1.5" y1="12" x2="3.5" y2="12"></line><line x1="20.5" y1="12" x2="22.5" y2="12"></line><line x1="4.6" y1="19.4" x2="6" y2="18"></line><line x1="18" y1="6" x2="19.4" y2="4.6"></line></svg></sc-if>
<sc-if value="{{isLight}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></sc-if>
</button>
</header>

<div style="position: absolute; left: 16px; right: 16px; top: 82px;">
<div role="radiogroup" aria-label="Режим колонки" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; {{t.glass}}">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
<button role="radio" aria-checked="{{m.on}}" onClick="{{m.pick}}" style="min-height: 40px; border-radius: 999px; border: 0; margin: 0; padding: 0 8px; cursor: pointer; font: inherit; font-size: 14px; transition: background 0.2s; {{m.style}}">{{m.label}}</button>
</sc-for>
</div>
<p style="margin: 8px 6px 0; font-size: 13px; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: {{noteColor}};">{{modeNote}}</p>
</div>

<nav aria-label="Разделы" style="position: absolute; left: 16px; right: 16px; bottom: 18px; height: 68px; box-sizing: border-box; border-radius: 34px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 0 6px; z-index: 10; {{t.glassStrong}}">
<button aria-current="page" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 0; margin: 0; padding: 0; background: transparent; cursor: pointer; font: inherit; font-size: 11px; line-height: 14px; font-weight: 800; color: {{t.accentText}};"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H4.5A1.5 1.5 0 0 1 3 20z"></path></svg>Колонка</button>
